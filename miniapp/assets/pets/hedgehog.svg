  <!-- Feet -->
  <ellipse cx="80" cy="160" rx="10" ry="8" fill="#c4915c"/>
  <ellipse cx="120" cy="160" rx="10" ry="8" fill="#c4915c"/>

  <!-- Cheeks -->
  <circle cx="72" cy="118" r="6" fill="#ffc0cb" opacity="0.4"/>
  <circle cx="128" cy="118" r="6" fill="#ffc0cb" opacity="0.4"/>
</svg>
