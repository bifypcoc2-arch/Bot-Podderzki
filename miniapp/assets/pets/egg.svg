<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Mysterious egg with cracks and glow -->
  <defs>
    <linearGradient id="eggGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e0e7ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c7d2fe;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="eggGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Glow behind egg -->
  <ellipse cx="100" cy="130" rx="50" ry="15" fill="#a78bfa" opacity="0.3"/>

  <!-- Egg body -->
  <ellipse cx="100" cy="100" rx="55" ry="70" fill="url(#eggGradient)" stroke="#8b5cf6" stroke-width="2"/>

  <!-- Cracks -->
  <path d="M 80 70 Q 85 75 80 80" stroke="#6366f1" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 120 90 Q 115 95 120 100" stroke="#6366f1" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 95 120 L 100 115 L 105 120" stroke="#6366f1" stroke-width="2" fill="none" opacity="0.6"/>

  <!-- Spots/pattern -->
  <ellipse cx="90" cy="95" rx="8" ry="10" fill="#a78bfa" opacity="0.3"/>
  <ellipse cx="110" cy="110" rx="6" ry="8" fill="#a78bfa" opacity="0.3"/>
  <ellipse cx="100" cy="80" rx="5" ry="6" fill="#a78bfa" opacity="0.3"/>

  <!-- Subtle pulse animation -->
  <ellipse cx="100" cy="100" rx="55" ry="70" fill="url(#eggGlow)">
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="3s" repeatCount="indefinite"/>
  </ellipse>
</svg>
