<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Sparkles and energy particles for conception stage -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Central glow -->
  <circle cx="100" cy="100" r="60" fill="url(#glow)">
    <animate attributeName="r" values="50;70;50" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Sparkle particles -->
  <circle cx="100" cy="60" r="3" fill="#fbbf24">
    <animate attributeName="cy" values="60;50;60" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="80" r="2" fill="#60a5fa">
    <animate attributeName="cx" values="140;150;140" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="80" r="2" fill="#f472b6">
    <animate attributeName="cy" values="80;70;80" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="140" r="3" fill="#a78bfa">
    <animate attributeName="cy" values="140;150;140" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="130" cy="120" r="2" fill="#34d399">
    <animate attributeName="r" values="2;4;2" dur="2.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="70" cy="120" r="2" fill="#fbbf24">
    <animate attributeName="r" values="2;3;2" dur="2.6s" repeatCount="indefinite"/>
  </circle>
</svg>
